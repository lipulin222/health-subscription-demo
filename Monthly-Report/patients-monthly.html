        weeks:[96.5, 96.4, 96.3, 96.2, 96.1], weekLabels:['W32','W33','W34','W35','W36'],
        end:96.1, delta:-0.4, total:-7.9, bmi:33.2, waist:104,
        analysis:'9月体重从 96.5kg 到 96.1kg，减了 0.4kg，四周几乎没动。你有冠心病，运动强度一直按医生划定的上限来；你做菜时把油、酱汁和糖另装小碟自己蘸，主食也按原量吃。这一个月你一直按这些做法吃和动，摄入和消耗之间的差距没有扩大，体重就停在 96kg 附近。\n10月你不用改饭量，也不自己加运动强度；运动在医生给的范围内换一换方式，做的时候留意有没有胸闷、气促、头晕或心悸，并把 9月的体重和身体反应记下来。能不能放宽运动强度，复查时由医生对照这份记录来判断。',

        weeks:[75.6, 75.4, 75.2, 75.1, 75.0], weekLabels:['W36','W37','W38','W39','W40'],
        end:75.0, delta:-0.6, total:-9.0, bmi:24.5, waist:90,
        analysis:'10月四周都在下降，越到后面减得越少：体重从 75.6kg 到 75.0kg，减了 0.6kg。你三餐里照常吃鱼、蛋、豆制品和奶，饭量没有再减少；你一直做平地慢走、八段锦和弹力带，也没有加量。这一期没有找到需要改动的地方。这个阶段走路、起身、上下楼顺不顺，比秤上的数字更要紧。\n11月你每顿仍留一份鱼、蛋、豆制品或奶，运动仍排平地慢走、八段锦和弹力带，膝盖不舒服就少做一点，让这些动作照常做得下来；体重每周记一次，血压血糖按原来的频率记，复查时把这几项记录带给医生，由医生对照 10月的身体状态判断要不要调整。',

      /* 11 · 接近结营 · 速度放缓（备孕，仅生活方式） */

        weeks:[80.3, 80.1, 79.9, 79.8, 79.7], weekLabels:['W40','W41','W42','W43','W44'],

    /* ---------------------------------------------------------- 渲染工具 ---- */
    var esc = (window.ZZ && window.ZZ.esc) || function (s) { return String(s == null ? '' : s); };
    var toast = (window.ZZ && window.ZZ.toast) || function () {};
    function fmt(v) { return (v < 0 ? '−' : '+') + Math.abs(v).toFixed(1); }
    function byId(id) {
      for (var i = 0; i < REPORTS.length; i++) if (REPORTS[i].id === id) return REPORTS[i];
      return null;
    }
    function byMonth(m) {
      for (var i = 0; i < REPORTS.length; i++) if (REPORTS[i].month === m) return REPORTS[i];
      return null;
    }

    /* 体重曲线（SVG，5 个描点，首尾标数字）—— 与 monthly.js 一致 */
    function chart(r) {
      var W = 320, H = 132, pl = 30, pr = 16, pt = 20, pb = 30;
      var v = r.weeks, n = v.length;
      var min = Math.min.apply(null, v), max = Math.max.apply(null, v);
      var span = Math.max(max - min, 0.8);
      min -= span * 0.18; max += span * 0.18;
      var iw = W - pl - pr, ih = H - pt - pb;
      var X = function (i) { return pl + iw * (i / (n - 1)); };
      var Y = function (a) { return pt + ih * (1 - (a - min) / (max - min)); };

      var pts = [], i, line = '', dots = '', ax = '';
      for (i = 0; i < n; i++) pts.push([X(i), Y(v[i])]);
      for (i = 0; i < n; i++) line += (i ? ' L' : 'M') + pts[i][0].toFixed(1) + ' ' + pts[i][1].toFixed(1);
      var area = line + ' L' + pts[n - 1][0].toFixed(1) + ' ' + (H - pb) + ' L' + pts[0][0].toFixed(1) + ' ' + (H - pb) + ' Z';
      for (i = 0; i < n; i++) {
        var big = (i === 0 || i === n - 1);
        dots += '<circle class="dt' + (big ? ' dt-lg' : '') + '" cx="' + pts[i][0].toFixed(1) +
          '" cy="' + pts[i][1].toFixed(1) + '" r="' + (big ? 4 : 3) + '"/>';
        ax += '<text class="ax" x="' + pts[i][0].toFixed(1) + '" y="' + (H - 11) + '" text-anchor="middle">' + esc(r.weekLabels[i]) + '</text>';
      }
      var labs = '<text class="vl" x="' + (pts[0][0] - 2) + '" y="' + (pts[0][1] - 11) + '" text-anchor="start">' + v[0].toFixed(1) + '</text>' +
        '<text class="vl" x="' + (pts[n - 1][0] + 2) + '" y="' + (pts[n - 1][1] - 11) + '" text-anchor="end">' + v[n - 1].toFixed(1) + '</text>';

      return '<div class="chart"><svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="本期体重变化折线图">' +
        '<defs><linearGradient id="gArea" x1="0" y1="0" x2="0" y2="1">' +
        '<stop offset="0%" stop-color="#009BBF" stop-opacity=".12"/>' +
        '<stop offset="100%" stop-color="#009BBF" stop-opacity="0"/></linearGradient></defs>' +
        '<path class="ar" d="' + area + '"/><path class="ln" d="' + line + '"/>' + dots + labs + ax + '</svg></div>';
    }

    function kpi(r) {
      return '<div class="kpi">' +
        '<div><span class="n">' + fmt(r.delta) + '<em>kg</em></span><span class="l">' + r.month + '月变化</span></div>' +
        '<div><span class="n">' + fmt(r.total) + '<em>kg</em></span><span class="l">累计变化</span></div>' +
        '<div><span class="n">' + r.bmi.toFixed(1) + '</span><span class="l">BMI</span></div>' +
        '<div><span class="n">' + r.waist + '<em>cm</em></span><span class="l">腰围</span></div>' +
        '</div>';
    }

    /* 本期配图：按月份取图（img/1.png … 12.png） */
    function hero(r) {
      return '<figure class="hero"><img loading="lazy" decoding="async" src="' + PIC + (r.month || r.no) + '.png" alt="' + r.month + '月配图" width="750" height="328"></figure>';
    }

    /* 节：编号 + 标题 + 条目组 */
    function section(no, title, groups) {
      var h = '<section class="sec"><span class="sec__no">' + no + '</span>' +
        '<h2 class="sec__t">' + title + '</h2>';
      groups.forEach(function (g) {
        if (g.label) h += '<div class="blk__lbl">' + g.label + '</div>';
        h += '<ul class="ul' + (g.num ? ' num' : '') + '">';
        g.items.forEach(function (t) { h += '<li>' + esc(t) + '</li>'; });
        h += '</ul>';
      });
      return h + '</section>';
    }

    /* 填写口径：当月 15 日（含）前填 = 上期，15 日后 = 当期 */
    function quizMonthName() {
      var now = new Date(), m = now.getMonth() + 1;
      if (now.getDate() < 15) m = m === 1 ? 12 : m - 1;
      return m + '月';
    }

    function reportHTML(r) {
      var h = '<div class="rp">' + hero(r);

      h += '<div class="rp__hd">' +
        '<div class="rp__eyebrow">体重管理 · 第 ' + r.no + ' 期月报</div>' +
        '<h1 class="rp__t">' + esc(r.title) + '</h1>' +
        '<div class="rp__meta">' + esc(r.range) + '<i>|</i>' + esc(r.span) + '</div></div>';

      h += '<section class="card ov">' +
        '<div class="ov__hd"><span class="ov__lbl">本期概览</span><span class="ov__sub">' + esc(r.span) + '</span></div>' +
        chart(r) + kpi(r) +
        '<button type="button" class="ov__hist" id="histBtn">查看其他月报</button></section>';

      /* 期数切换：结构与 monthly.js 一致，点击切换到对应患者的月报 */
      h += '<div class="chips" id="chips" hidden>';
      REPORTS.forEach(function (it) {
        h += '<button type="button" class="chip' + (it.id === r.id ? ' on' : '') +
          '" data-id="' + it.id + '">第 ' + it.no + ' 期</button>';
      });
      h += '</div>';

      var nextMonth = (r.month % 12) + 1;
      h += '<section class="sec"><span class="sec__no">01</span>' +
        '<h2 class="sec__t">减重数据分析</h2>' +
        String(r.analysis).split('\n').filter(Boolean).map(function (t) {
          return '<p class="p">' + esc(t) + '</p>';
        }).join('') + '</section>';
      h += section('02', nextMonth + '月的饮食与运动', [
        { label: '饮食', items: r.diet, num: true },
        { label: '运动', items: r.sport, num: true }
      ]);

      h += '<div class="fine"><p>体重为晨起空腹测量，腰围为肚脐水平呼气末测量，体成分来自 InBody。本页为健康管理服务记录，不构成诊疗建议。</p>' +
        '<p><a href="javascript:void(0)" id="refill">补填' + quizMonthName() + '状态</a></p></div></div>';
      return h;
    }

    /* ------------------------------------------------------------ 页面逻辑 ---- */
    var reportEl = document.getElementById('report');
    var topbarEl = document.getElementById('topbar');
    var phoneEl = document.getElementById('phone');
    var menuEl = document.getElementById('dispMenu');
    var swEl = document.getElementById('dispSw');

    function show(id) {
      var r = byId(id);
      if (!r) return;
      reportEl.innerHTML = reportHTML(r);
      reportEl.scrollTop = 0;
      document.getElementById('topTitle').textContent = '减重月报';
      phoneEl.classList.add('has-hero');
      reportEl.classList.add('page--hero');
      topbarEl.classList.remove('solid');

      /* 期数胶囊：切到对应患者 */
      [].slice.call(reportEl.querySelectorAll('.chip')).forEach(function (c) {
        c.addEventListener('click', function () { show(c.getAttribute('data-id')); syncMenu(); });
      });
      var hist = document.getElementById('histBtn');
      hist.addEventListener('click', function () {
        var chips = document.getElementById('chips');
        var open = chips.hidden;
        chips.hidden = !open;
        hist.textContent = open ? '收起' : '查看其他月报';
        if (open) reportEl.scrollTop = 0;
      });
      document.getElementById('refill').addEventListener('click', function () {
        toast('样例演示：状态快问快答未接入');
      });
      syncMenu();
    }

    function syncMenu() {
      var cur = reportEl.querySelector('.chip.on');
      var id = cur ? cur.getAttribute('data-id') : '';
      [].slice.call(menuEl.querySelectorAll('button[data-p]')).forEach(function (b) {
        b.classList.toggle('is-cur', b.getAttribute('data-p') === id);
      });
    }

    /* 顶栏 ⋯ 菜单：与评估报告页一致 */
    REPORTS.forEach(function (r) {
      var b = document.createElement('button');
      b.type = 'button'; b.setAttribute('data-p', r.id);
      b.textContent = r.id + ' ' + r.name + ' · ' + r.month + '月';
      b.addEventListener('click', function () { swEl.classList.remove('is-open'); show(r.id); });
      menuEl.appendChild(b);
    });
    document.getElementById('moreBtn').addEventListener('click', function (e) {
      e.stopPropagation(); swEl.classList.toggle('is-open');
    });
    document.addEventListener('click', function (e) {
      if (!swEl.contains(e.target)) swEl.classList.remove('is-open');
    });

    document.getElementById('backBtn').addEventListener('click', function () {
      if (history.length > 1) history.back();
      else location.href = BACK_URL;
    });
    reportEl.addEventListener('scroll', function () {
      topbarEl.classList.toggle('solid', reportEl.scrollTop > 140);
    });

    /* 深链：?id=Pxx 指定患者，?m=1..11 指定月份，?disp= 兼容评估报告口径 */
    var Q = new URLSearchParams(location.search);
    var DISP2PID = { normal:'P1', mild:'P3', chronic:'P4' };
    var init = (Q.get('id') && byId(Q.get('id'))) ? Q.get('id') :
      (byMonth(parseInt(Q.get('m'), 10)) || byId(DISP2PID[Q.get('disp')]) || REPORTS[0]).id;
    show(init);
  })();
  </script>
