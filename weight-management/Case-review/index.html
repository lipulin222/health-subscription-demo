<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>减重评估 · 真实用户 Case 演示（脱敏）</title>
<style>
/* 复用 weight-management/Assessment-report（DistinctUI 3.0）的视觉体系 */
:root {
  --bg-page:#F2F5F6; --stroke:#E1E1E1; --divider:#E8E8E8;
  --t-title:#1A1A1A; --t-primary:#333333; --t-secondary:#666666; --t-placeholder:#999999;
  --brand:#009BBF; --brand-focus:#CAECF3; --brand-light:#EDFAFC; --brand-light-active:#DEF3F7; --brand-active:#007C99;
  --warn:#E6732F; --gray:#98A2A8;
  --radius-small:2px; --radius-default:4px; --radius-large:6px; --radius-card:8px; --radius-panel:12px;
  --space-card-gap:10px; --space-module-gap:15px;
  --fs-1:11px; --fs-2:12px; --fs-3:14px; --fs-4:16px; --fs-5:17px;
  --ease:cubic-bezier(.2,.8,.2,1);
  --font:"PingFang SC","HarmonyOS Sans SC","MiSans",-apple-system,"Microsoft YaHei",sans-serif;
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { font-family:var(--font); color:var(--t-primary); background:#EBEFF0; -webkit-font-smoothing:antialiased; line-height:1.7; }
button { font-family:var(--font); }

/* ===== 页头 ===== */
.top { background:#FFF; border-bottom:1px solid var(--divider); padding:18px 28px 16px; }
.top__hd { display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; }
.top__t { font-size:20px; font-weight:600; color:var(--t-title); }
.top__tag { font-size:12px; color:var(--brand); background:var(--brand-light); border-radius:999px; padding:3px 12px; }
.top__d { margin-top:6px; font-size:13px; color:var(--t-secondary); line-height:21px; max-width:1080px; }
.top__d b { color:var(--t-primary); font-weight:500; }

/* ===== 布局 ===== */
.wrap { display:flex; gap:20px; padding:20px 28px 40px; align-items:flex-start; max-width:1560px; margin:0 auto; }
.left { flex:0 0 400px; position:sticky; top:20px; max-height:calc(100vh - 60px); overflow-y:auto; scrollbar-width:thin; }
.right { flex:1 1 auto; min-width:0; display:flex; justify-content:center; }
.report { width:100%; max-width:640px; background:var(--bg-page); border-radius:var(--radius-panel); box-shadow:0 0 30px rgba(0,0,0,.06); padding:14px 15px var(--space-module-gap); }
@media (max-width:1080px) { .wrap { flex-direction:column; } .left { position:static; max-height:none; flex:none; width:100%; } }

/* ===== 左栏：case 列表 ===== */
.card { background:#FFF; border-radius:var(--radius-card); }
.list { padding:8px; }
.list__cap { padding:8px 10px 4px; font-size:11px; color:var(--t-placeholder); }
.case-btn { display:flex; align-items:center; gap:10px; width:100%; text-align:left; cursor:pointer; border:none; background:none; border-radius:var(--radius-large); padding:9px 10px; transition:background .15s var(--ease); }
.case-btn:hover { background:var(--bg-page); }
.case-btn.is-cur { background:var(--brand-light); }
.case-btn.is-cur .cb__name { color:var(--brand); }
.cb__name { flex:0 0 auto; font-size:14px; font-weight:600; color:var(--t-title); min-width:56px; }
.cb__tag { flex:1 1 auto; min-width:0; font-size:12px; color:var(--t-secondary); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.badge { flex:0 0 auto; font-size:10px; border-radius:999px; padding:2px 8px; line-height:1.5; }
.badge--1 { color:var(--gray); background:#EEF1F2; }
.badge--2 { color:var(--brand); background:var(--brand-light); }
.badge--3 { color:var(--warn); background:#FBF0E7; }

/* ===== 左栏：case 详情 ===== */
.detail { margin-top:12px; }
.dt__hd { padding:14px 16px 4px; }
.dt__name { font-size:17px; font-weight:600; color:var(--t-title); display:flex; align-items:center; gap:10px; }
.dt__sec { padding:12px 16px 2px; }
.dt__cap { font-size:11px; color:var(--t-placeholder); margin-bottom:6px; display:flex; align-items:center; gap:6px; }
.dt__cap::before { content:""; width:3px; height:11px; border-radius:2px; background:var(--brand); }
.facts { width:100%; border-collapse:separate; border-spacing:0; font-size:13px; }
.facts td { padding:7px 10px; border-bottom:1px solid var(--divider); vertical-align:top; line-height:1.6; }
.facts tr:last-child td { border-bottom:none; }
.facts td:first-child { width:88px; color:var(--t-placeholder); }
.facts td:last-child { color:var(--t-primary); }
.klist { list-style:none; }
.klist li { position:relative; padding-left:14px; font-size:13px; color:var(--t-secondary); line-height:1.7; }
.klist li + li { margin-top:5px; }
.klist li::before { content:""; position:absolute; left:2px; top:.68em; width:4px; height:4px; border-radius:50%; background:var(--brand); }
.qa { list-style:none; }
.qa li { display:flex; gap:10px; padding:7px 0; border-bottom:1px solid var(--divider); font-size:12.5px; line-height:1.6; }
.qa li:last-child { border-bottom:none; }
.qa__q { flex:0 0 190px; color:var(--t-placeholder); }
.qa__a { flex:1 1 auto; min-width:0; color:var(--t-primary); }
.qa__a em { font-style:normal; color:var(--t-placeholder); }
.dt__foot { padding:6px 16px 14px; font-size:11px; color:var(--t-placeholder); line-height:18px; }

/* ===== 右栏：评估报告（同 Assessment-report）===== */
.hero { border-radius:var(--radius-card); padding:15px; background:#FFF; }
.hero__name { display:block; font-size:17px; font-weight:600; color:var(--t-title); line-height:24px; }
.hero__meta { display:block; margin-top:4px; font-size:var(--fs-2); color:var(--t-placeholder); line-height:17px; }
.grade { margin-top:12px; background:var(--brand-light); border-radius:var(--radius-default); padding:11px 13px 12px; }
.grade__h { display:flex; align-items:center; gap:8px; font-size:var(--fs-1); line-height:1.4; color:var(--t-secondary); }
.grade__h b { font-size:var(--fs-3); color:var(--brand); font-weight:600; }
.grade__bar { display:flex; gap:4px; margin-top:9px; }
.grade__bar i { flex:1; height:3px; border-radius:2px; background:var(--brand-focus); }
.grade__bar i.is-on { background:var(--brand); }
.grade__ax { display:flex; gap:4px; margin-top:6px; }
.grade__ax span { flex:1; text-align:center; font-size:10px; color:var(--t-placeholder); line-height:1.35; }
.grade__ax span.is-on { color:var(--brand); font-weight:500; }
.hero__hint { display:block; margin-top:10px; font-size:var(--fs-3); line-height:23px; color:var(--t-secondary); text-align:left; }
.mod { margin-top:var(--space-card-gap); overflow:hidden; }
.mod__h { display:flex; align-items:center; gap:9px; padding:12px 15px; }
.mod__no { flex-shrink:0; font-size:10px; font-weight:500; letter-spacing:.04em; color:#FFF; background:var(--brand); border-radius:var(--radius-small); padding:2px 6px; line-height:1.5; }
.mod__t { flex:1; min-width:0; font-size:15px; font-weight:600; color:var(--t-title); line-height:22px; }
.mod__b-in { padding:0 15px 15px; }
.mod__b-in p { font-size:var(--fs-3); line-height:24px; color:var(--t-secondary); }
.mod__b-in > * + * { margin-top:10px; }
.mod__b-in .note { font-size:var(--fs-2); line-height:19px; color:var(--t-placeholder); }
.ul { list-style:none; }
.ul li { position:relative; padding-left:16px; font-size:var(--fs-3); color:var(--t-secondary); line-height:24px; }
.ul li::before { content:""; position:absolute; left:4px; top:.72em; width:4px; height:4px; border-radius:50%; background:var(--brand); }
.ul b { color:inherit; font-weight:400; }
.mbar { display:flex; align-items:center; gap:10px; }
.mbar__lab { font-size:var(--fs-2); color:var(--t-secondary); flex-shrink:0; }
.mbar__lv { font-size:var(--fs-3); font-weight:600; color:var(--brand); flex-shrink:0; }
.mbar__tr { flex:1 1 auto; max-width:320px; height:4px; border-radius:2px; background:var(--stroke); overflow:hidden; }
.mbar__tr i { display:block; height:100%; border-radius:2px; background:var(--brand); }
.tb { width:100%; border-collapse:separate; border-spacing:0; margin-top:var(--space-card-gap); font-size:13px; }
.tb th, .tb td { padding:9px 11px; text-align:left; vertical-align:top; line-height:1.7; }
.tb th { background:var(--bg-page); color:var(--t-secondary); font-size:var(--fs-1); font-weight:500; }
.tb th:first-child { border-radius:var(--radius-default) 0 0 0; }
.tb th:last-child { border-radius:0 var(--radius-default) 0 0; }
.tb td { border-bottom:1px solid var(--divider); color:var(--t-primary); }
.tb tr:last-child td { border-bottom:none; }
.tb td:first-child { width:76px; }
.disc { margin-top:var(--space-card-gap); padding:0 2px 4px; font-size:var(--fs-1); color:var(--t-placeholder); line-height:18px; text-align:left; }
.hl { font-style:normal; color:var(--brand); }
/* 健康影响链 */
.chain { margin:2px 0 14px; display:flex; align-items:flex-start; }
.chain__col { flex:1 1 0; min-width:0; display:flex; flex-direction:column; align-items:center; }
.chain__ico { width:100%; max-width:46px; aspect-ratio:1/1; }
.chain__ico img { width:100%; height:100%; display:block; }
.chain__t { margin-top:5px; font-size:12px; font-weight:400; color:#1F8CA8; line-height:17px; white-space:nowrap; }
.chain__lk { flex:0 0 auto; padding-top:14px; color:#999999; font-size:12px; line-height:17px; white-space:nowrap; }
</style>
</head>
<body>

<header class="top">
  <div class="top__hd">
    <span class="top__t">减重评估 · 真实用户 Case 演示</span>
    <span class="top__tag">数据已脱敏 · 10 位代表性画像</span>
  </div>
  <p class="top__d"><b>说明：</b>左侧 case 关键信息提炼自两批真实服务数据（患者已改用假名，年龄、体测与细节做了模糊化处理，不含真实姓名、ID、就诊机构与医生）；问卷答案按真实用户答题习惯<b>模拟</b>（多数人不会照搬病历、也懒得写字）；右侧评估报告按 <b>REQ-WL-PLAN-06 减重评估报告提示词</b>口径生成，页面样式对齐线上评估报告页。本页仅用于内部演示，不构成医疗建议。</p>
</header>

<div class="wrap">
  <aside class="left">
    <div class="card list" id="caseList"><div class="list__cap">Case 用户（点击切换）</div></div>
    <div class="card detail" id="caseDetail"></div>
  </aside>
  <main class="right">
    <div class="report" id="view"></div>
  </main>
</div>

<script>
'use strict';
/* ===== 工具（与 Assessment-report 同口径）===== */
var DISC = '本页内容基于你填写的问卷与已关联的健康数据生成，为初步评估建议，不构成诊断和处方。';
var AXIS = ['无需减重','需要减重管理','需要减重与慢病结合管理'];
var TIER = {
  exclude:   { value:'无需减重', cur:1, b:'badge--1', bt:'第1档 · 无需减重' },
  normal:    { value:'需要减重管理', cur:2, b:'badge--2', bt:'第2档 · 需要减重管理' },
  offline:   { value:'需要减重与慢病结合管理', cur:3, b:'badge--3', bt:'第3档 · 需要减重与慢病结合管理' }
};
var ARW = '';
function ul(items){ return '<ul class="ul">' + items.map(function(it){ return '<li><b>'+it[0]+'</b>：'+it[1]+'</li>'; }).join('') + '</ul>'; }
function jin(w,pct){ return Math.round(w*pct/100*2); }
function drugTable(w){
  var TB = [['1 个月','3%–4%','−'+jin(w,3)+'~'+jin(w,4)+' 斤'],['3 个月','8%–10%','−'+jin(w,8)+'~'+jin(w,10)+' 斤'],['6 个月','12%–15%','−'+jin(w,12)+'~'+jin(w,15)+' 斤'],['12 个月','18%–21%','−'+jin(w,18)+'~'+jin(w,21)+' 斤']];
  return '<table class="tb"><thead><tr><th>周期</th><th>平均减重</th><th>你的参考值</th></tr></thead><tbody>' +
    TB.map(function(r){ return '<tr><td>'+r[0]+'</td><td>'+r[1]+'</td><td>'+r[2]+'</td></tr>'; }).join('') + '</tbody></table>';
}
function mbar(level,pct){
  return '<div class="mbar"><span class="mbar__lab">匹配度</span><span class="mbar__lv">'+level+'</span><span class="mbar__tr"><i style="width:'+pct+'%"></i></span></div>';
}
function chain(){
  var ROWS = [
    ['icons/ico-life.png','生活方式'],
    ['icons/ico-weight.png','体重增加'],
    ['icons/ico-index.png','指标异常'],
    ['icons/ico-chronic.png','慢性疾病']
  ];
  var LINKS = ['影响','导致','发展'];
  var h = '<div class="chain">';
  ROWS.forEach(function(r,i){
    h += '<div class="chain__col"><span class="chain__ico"><img loading="lazy" decoding="async" src="'+r[0]+'" alt="" aria-hidden="true"></span>' +
      '<b class="chain__t">'+r[1]+'</b></div>';
    if (i < LINKS.length) h += '<div class="chain__lk">'+LINKS[i]+' &gt;</div>';
  });
  return h + '</div>';
}
var FIXED_P = '<p>不良的生活方式（暴饮暴食、缺乏运动、作息不佳）导致体重增加，进而引起血压、血糖、血脂等指标异常。异常指标持续发展，最终演变为高血压、糖尿病等不可逆的慢性疾病。</p>';
var DRUG_LEAD = '根据你当前的体重情况，参考按临床数据，用药后的体重预计变化情况如下：';
var DRUG_NOTE = '<p class="note">上述区间来自临床研究，个体差异较大，以实际随访数据为准。</p>';
function drugFit(p, why){
  return mbar('较高',78) +
    '<p>结合你的情况，我们建议在调整饮食和运动的同时，配合 GLP-1 类药物一起减。核心理由是：<br><span class="hl">' + why + '</span></p>' +
    '<p>' + DRUG_LEAD + '</p>' + drugTable(p.w) + DRUG_NOTE;
}
function drugOffline(){
  return mbar('需医生面诊评估',65) +
    '<p>GLP-1 类药物与你正在使用的药物可能相互影响，需要医生统一评估后才能使用。</p>' +
    '<p class="note">匹配度基于初步信息估算，个体差异较大。</p>';
}
function drugNo(reason){
  return mbar('不适用',10) + '<p>' + reason + '</p>';
}

/* ===== 10 位脱敏 case（问卷答案为模拟，报告按 REQ-WL-PLAN-06 口径生成）===== */
var Q = ['你的性别','你的年龄','你的身高与体重','你认为导致你体重增加的主要原因','目前确诊过的疾病','最近体检提示偏高的指标','你或直系亲属是否被诊断过甲状腺髓样癌或 2 型多发性内分泌腺瘤病','安全筛查：你现在或曾经有过以下情况吗','你是否在备孕、怀孕或哺乳','除体重数字外，你的治疗目标','你还有什么想补充的（选填）'];

var CASES = [
/* ---------- C1 ---------- */
{ id:'C1', name:'林嘉禾', tag:'23 岁大基数新客 · 无慢病', tier:'normal', gender:'女', age:23, h:163, w:86, bmi:32.4,
  key:[
    '23 岁女性，初诊体重约 86kg（BMI 32.2），无确诊慢病',
    '体检提示甲状腺回声弥漫性改变，医生建议查甲状腺抗体（尚未确诊）',
    '否认甲状腺髓样癌家族史及胰腺炎病史；屏障避孕',
    'GLP-1 起始剂量 2.5mg，目标体重 60kg',
    '画像要点：年轻、大基数、代谢指标尚未出问题，是干预窗口最好的类型'
  ],
  qa:[
    ['女'],['23'],['身高 163cm、体重 86kg（BMI 32.4，自动计算）'],
    ['饮食习惯（爱吃甜食、外卖多）、缺乏运动、睡眠不足'],
    ['以上都没有'],['以上都没有'],['没有'],['以上都没有'],['否'],
    ['改善健康指标（血糖 / 血脂 / 血压等）、追求好身材，穿衣服好看'],
    ['<em>未填写</em>']
  ],
  hint:'你的 BMI 已达 32.4，长期来看对血压、血脂和睡眠都是负担，减重的必要性明确。建议饮食、运动与药物治疗同步开展，三者结合能达到最好的效果。',
  mods:[
    { t:'整体建议', html:
      FIXED_P + chain() +
      '<p>你当前的BMI为32.4，结合问卷信息，初步判断你当前正处于<em class="hl">指标异常向慢性疾病发展</em>的过渡期。体重增加的原因是甜食外卖偏多的饮食习惯、缺乏运动和长期熬夜；当下的主要任务是建立规律的三餐和活动节奏，把体重稳步降下来。</p>' },
    { t:'饮食建议', html:'<p>你的饮食问题集中在甜食、外卖和熬夜带来的夜宵，调整就从这三个源头下手：</p>' +
      ul([['含糖饮料和甜食先停','这是你体重增加最直接的来源，戒断后变化也最明显'],['外卖换成有选择的点法','优先蒸煮做法和荤素搭配，少点油炸、盖浇和重酱料'],['固定三餐，晚饭后不再进食','熬夜容易带来夜宵，先把这个循环断开']]) +
      '<p class="note">进入后续流程后，营养师会结合你的口味与作息给出个性化食谱。</p>' },
    { t:'运动建议', html:'<p>运动先把活动量建立起来，再逐步提升强度：</p>' +
      ul([['每天快走 20–30 分钟','通勤提前下车、饭后散步都可以计入'],['久坐时每小时起身活动','设提醒即可，先打断连续久坐'],['两三周后加入力量训练','每周 2 次，保住肌肉量，减重后不易反弹']]) },
    { t:'用药建议', html:'@DRUG@' }
  ],
  why:'体重基数较大时，减重初期单靠运动消耗有限、关节负担也重，而工作节奏快、常熬夜的生活方式又很难长期自律；药物可以先把体重降下来、加快减重进程，让你更早看到变化、更容易建立信心，提高减重的成功概率。' },

/* ---------- C2 ---------- */
{ id:'C2', name:'周子昂', tag:'28 岁男性 · 脂肪肝 + 高尿酸', tier:'normal', gender:'男', age:28, h:175, w:74.5, bmi:24.3,
  key:[
    '28 岁男性，基线体重约 80kg（BMI 28.9），就诊时已自行减至 74.7kg',
    '重度脂肪肝、转氨酶升高（ALT 76U/L）；尿酸 684μmol/L',
    '血脂异常（LDL 3.77 / HDL 0.83 / TG 3.04 mmol/L）；肌酐 100μmol/L（临界）',
    '夜间打鼾，医生建议睡眠监测（未做）；HbA1c 5.6% 正常',
    '玛仕度肽 2mg 因腹胀换用替尔泊肽 2.5mg',
    '画像要点：年轻男性、代谢指标全面亮红灯、用药有胃肠不适'
  ],
  qa:[
    ['男'],['28'],['身高 175cm、体重 74.5kg（BMI 24.3，自动计算）'],
    ['饮食习惯（外卖多）、久坐'],
    ['脂肪肝'],
    ['血脂偏高、尿酸偏高、体检提示脂肪肝'],
    ['没有'],['以上都没有'],['<em>男性，跳过</em>'],
    ['改善健康指标（血糖 / 血脂 / 血压等）'],
    ['“转氨酶有点高，想顺便把肝的问题一起改善”']
  ],
  hint:'你的 BMI 24.3 刚过建议干预线，确诊的脂肪肝和偏高的血脂、尿酸都会随体重下降改善，现在是干预成本最低的时候。建议饮食、运动与药物治疗同步开展，肝酶和尿酸是你这次减重最先受益的指标。',
  mods:[

/* ===== 回填用药模块 ===== */
CASES.forEach(function(c){
  c.mods.forEach(function(m){
    if (m.html === '@DRUG@') {
      m.html = c.tier === 'offline' ? drugOffline() : drugFit(c, c.why);
    } else if (m.html === '@DRUG_NO@') {
      m.html = drugNo(c.drugNo);
    }
  });
});

/* ===== 左栏 ===== */
var listEl = document.getElementById('caseList');
var detailEl = document.getElementById('caseDetail');
var viewEl = document.getElementById('view');

CASES.forEach(function(c){
  var b = document.createElement('button');
  b.type = 'button'; b.className = 'case-btn'; b.dataset.id = c.id;
  b.innerHTML = '<span class="cb__name">' + c.name + '</span><span class="cb__tag">' + c.tag + '</span>' +
    '<span class="badge ' + TIER[c.tier].b + '">' + TIER[c.tier].cur + '档</span>';
  b.addEventListener('click', function(){ render(c.id); });
  listEl.appendChild(b);
});

function facts(pairs){
  return '<table class="facts">' + pairs.map(function(p){
    return '<tr><td>' + p[0] + '</td><td>' + p[1] + '</td></tr>';
  }).join('') + '</table>';
}

function renderDetail(c){
  var t = TIER[c.tier];
  detailEl.innerHTML =
    '<div class="dt__hd"><div class="dt__name">' + c.name + '<span class="badge ' + t.b + '">' + t.bt + '</span></div></div>' +
    '<div class="dt__sec"><div class="dt__cap">基础信息</div>' +
      facts([['性别 / 年龄', c.gender + ' · ' + c.age + ' 岁'],['身高 / 体重', c.h + 'cm / ' + c.w + 'kg'],['BMI', c.bmi],['一句话画像', c.tag]]) + '</div>' +
    '<div class="dt__sec"><div class="dt__cap">关键信息（脱敏，提炼自真实服务数据）</div>' +
      '<ul class="klist">' + c.key.map(function(k){ return '<li>' + k + '</li>'; }).join('') + '</ul></div>' +
    '<div class="dt__sec"><div class="dt__cap">模拟问卷答案（11 题）</div>' +
      '<ul class="qa">' + c.qa.map(function(a, i){
        return '<li><span class="qa__q">' + (i + 1) + '. ' + Q[i] + '</span><span class="qa__a">' + a[0] + '</span></li>';
      }).join('') + '</ul></div>' +
    '<div class="dt__foot">问卷答案为按真实用户答题习惯的模拟：多数人凭记忆粗略作答、不会照搬病历，开放题经常留空。</div>';
}

/* ===== 右栏：评估报告（同 Assessment-report 渲染口径）===== */
function heroHtml(c){
  var t = TIER[c.tier], i, bars = '', axis = '';
  for (i = 0; i < AXIS.length; i++) {
    bars += '<i class="' + (i === t.cur - 1 ? 'is-on' : '') + '"></i>';
    axis += '<span class="' + (i === t.cur - 1 ? 'is-on' : '') + '">' + AXIS[i] + '</span>';
  }
  return '<section class="hero">' +
    '<span class="hero__name">' + c.name + '</span>' +
    '<span class="hero__meta">' + c.gender + ' · ' + c.age + ' 岁 · ' + c.h + 'cm / ' + c.w + 'kg · BMI ' + c.bmi + '</span>' +
    '<div class="grade"><div class="grade__h"><span>减重建议</span><b>' + t.value + '</b></div>' +
    '<div class="grade__bar">' + bars + '</div><div class="grade__ax">' + axis + '</div></div>' +
    '<span class="hero__hint">' + c.hint + '</span>' +
    '</section>';
}

function render(id){
  var c = CASES.filter(function(x){ return x.id === id; })[0];
  document.querySelectorAll('.case-btn').forEach(function(b){
    b.classList.toggle('is-cur', b.dataset.id === id);
  });
  renderDetail(c);
  viewEl.innerHTML = heroHtml(c) +
    c.mods.map(function(m, i){
      return '<section class="mod card"><div class="mod__h"><span class="mod__no">' + ('0' + (i + 1)).slice(-2) + '</span>' +
        '<span class="mod__t">' + m.t + '</span></div>' +
        '<div class="mod__b-in">' + m.html + '</div></section>';
    }).join('') +
    '<div class="disc">' + DISC + '</div>';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

render('C1');
