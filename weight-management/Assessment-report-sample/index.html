<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>减重评估报告 · 10人样例输出（v3）</title>
<style>
/* 视觉对齐：weight-management/Assessment-report（DistinctUI 3.0，375px 壳） */
:root {
  --bg-page:#F2F5F6; --stroke:#E1E1E1; --divider:#E8E8E8;
  --t-title:#1A1A1A; --t-primary:#333333; --t-secondary:#666666; --t-placeholder:#999999;
  --brand:#009BBF; --brand-focus:#CAECF3; --brand-light:#EDFAFC; --brand-light-active:#DEF3F7; --brand-active:#007C99;
  --btn-default-border:#DCDCDC;
  --radius-small:2px; --radius-default:4px; --radius-large:6px; --radius-card:8px; --radius-panel:12px;
  --space-card-gap:10px; --space-module-gap:15px;
  --fs-1:11px; --fs-2:12px; --fs-3:14px; --fs-4:16px; --fs-5:17px;
  --ease:cubic-bezier(.2,.8,.2,1);
  --font:"PingFang SC","HarmonyOS Sans SC","MiSans",-apple-system,"Microsoft YaHei",sans-serif;
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
[hidden] { display:none !important; }
html, body { font-family:var(--font); color:var(--t-primary); background:var(--bg-page); -webkit-font-smoothing:antialiased; line-height:1.7; scrollbar-width:none; -ms-overflow-style:none; }
html::-webkit-scrollbar, body::-webkit-scrollbar { width:0; height:0; display:none; }
body { display:flex; justify-content:center; min-height:100vh; }

.shell { display:flex; justify-content:center; width:100%; }
.phone { width:100%; max-width:375px; height:100vh; height:100dvh; position:relative; display:flex; flex-direction:column; overflow:hidden; background:var(--bg-page); }
@media (min-width:480px) { .phone { margin:24px 0; height:calc(100vh - 48px); height:calc(100dvh - 48px); border-radius:var(--radius-panel); box-shadow:0 0 40px rgba(0,0,0,.08); } }

.topbar { height:44px; display:flex; align-items:center; background:#FFF; padding:0 6px; flex-shrink:0; position:relative; z-index:5; }
.topbar__back, .topbar__more { width:32px; height:32px; display:flex; align-items:center; justify-content:center; border:none; background:none; cursor:pointer; color:var(--t-primary); border-radius:50%; flex-shrink:0; }
.topbar__back svg { width:24px; height:24px; }
.topbar__back:active, .topbar__more:active { background:var(--brand-light-active); }
.topbar__more { gap:2.5px; }
.topbar__more span { width:3.5px; height:3.5px; border-radius:50%; background:currentColor; display:block; }
.topbar__title { flex:1; text-align:center; font-size:var(--fs-5); font-weight:600; color:var(--t-title); }

.page { flex:1; min-height:0; overflow-y:auto; padding:0 15px var(--space-module-gap); -webkit-overflow-scrolling:touch; scrollbar-width:none; -ms-overflow-style:none; }
.page::-webkit-scrollbar { width:0; height:0; display:none; }

.card { background:#FFF; border-radius:var(--radius-card); }
.btn { display:flex; align-items:center; justify-content:center; gap:6px; width:100%; height:40px; cursor:pointer; font-family:var(--font); background:var(--brand); color:#FFF; border:none; border-radius:var(--radius-large); font-size:var(--fs-4); font-weight:600; transition:background .15s var(--ease); }
.btn:active { background:var(--brand-active); }
.btn--ghost { background:#FFF; color:var(--t-primary); border:1px solid var(--btn-default-border); }
.btn--ghost:active { background:var(--bg-page); }

@keyframes viewIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:none; } }
.view-in { animation:viewIn .26s var(--ease); }

/* 结论头 */
.hero { margin-top:10px; border-radius:var(--radius-card); padding:15px; background:#FFF; }
.hero__hd { position:relative; }
.hero__name { display:block; font-size:17px; font-weight:600; color:var(--t-title); line-height:24px; }
.hero__meta { display:block; margin-top:4px; padding-right:32px; font-size:var(--fs-2); color:var(--t-placeholder); line-height:17px; }
.hero__info { position:absolute; top:1px; right:0; width:26px; height:26px; display:flex; align-items:center; justify-content:center; border:none; background:none; border-radius:50%; color:var(--t-placeholder); cursor:pointer; transition:color .16s var(--ease); }
.hero__info:active { color:var(--brand); }
.hero__info svg { width:17px; height:17px; display:block; }
.hero__tip { position:absolute; top:32px; right:0; z-index:5; background:rgba(26,26,26,.88); color:#FFF; font-size:var(--fs-1); line-height:16px; padding:7px 11px; border-radius:8px; white-space:nowrap; }
.hero__tip::before { content:""; position:absolute; top:-4px; right:9px; width:8px; height:8px; background:inherit; transform:rotate(45deg); border-radius:1px; }

/* 建议等级刻度 */
.grade { margin-top:12px; background:var(--brand-light); border-radius:var(--radius-default); padding:11px 13px 12px; }
.grade__h { display:flex; align-items:center; gap:8px; font-size:var(--fs-1); line-height:1.4; color:var(--t-secondary); }
.grade__h b { font-size:var(--fs-3); color:var(--brand); font-weight:600; }
.grade__bar { display:flex; gap:4px; margin-top:9px; }
.grade__bar i { flex:1; height:3px; border-radius:2px; background:var(--brand-focus); transition:background .3s var(--ease); }
.grade__bar i.is-on { background:var(--brand); }
.grade__ax { display:flex; gap:4px; margin-top:6px; }
.grade__ax span { flex:1; text-align:center; font-size:10px; color:var(--t-placeholder); line-height:1.35; }
.grade__ax span.is-on { color:var(--brand); font-weight:500; }
.hero__hint { display:block; margin-top:10px; font-size:var(--fs-3); line-height:23px; color:var(--t-secondary); text-align:left; }

/* 模块卡（可折叠） */
.mod { margin-top:var(--space-card-gap); overflow:hidden; }
.mod__h { display:flex; align-items:center; gap:9px; width:100%; cursor:pointer; font-family:var(--font); text-align:left; background:none; border:none; padding:12px 15px; transition:background .18s var(--ease); }
.mod__h:active { background:var(--brand-light-active); }
.mod__no { flex-shrink:0; font-size:10px; font-weight:500; letter-spacing:.04em; color:#FFF; background:var(--brand); border-radius:var(--radius-small); padding:2px 6px; line-height:1.5; }
.mod__t { flex:1; min-width:0; font-size:15px; font-weight:600; color:var(--t-title); line-height:22px; }
.mod__arw { flex-shrink:0; width:22px; height:22px; color:var(--t-placeholder); display:flex; align-items:center; justify-content:center; transition:transform .24s var(--ease); }
.mod__arw svg { width:16px; height:16px; }
.mod.is-fold .mod__arw { transform:rotate(-90deg); }
.mod__b { overflow:hidden; max-height:none; opacity:1; transition:max-height .32s var(--ease), opacity .22s var(--ease); }
.mod.is-fold .mod__b { max-height:0; opacity:0; }
.mod__b-in { padding:0 15px 15px; }
.mod__b-in p { font-size:var(--fs-3); line-height:24px; color:var(--t-secondary); }
.mod__b-in > * + * { margin-top:10px; }
.mod__b-in .note { font-size:var(--fs-2); line-height:19px; color:var(--t-placeholder); }

.ul { list-style:none; }
.ul li { position:relative; padding-left:16px; font-size:var(--fs-3); color:var(--t-secondary); line-height:24px; }
.ul li + li { margin-top:0; }
.ul li::before { content:""; position:absolute; left:4px; top:.72em; width:4px; height:4px; border-radius:50%; background:var(--brand); }
.ul b { color:inherit; font-weight:400; }

/* 匹配度条 */
.mbar { display:flex; align-items:center; gap:10px; }
.mbar__lab { font-size:var(--fs-2); color:var(--t-secondary); flex-shrink:0; }
.mbar__lv { font-size:var(--fs-3); font-weight:600; color:var(--brand); flex-shrink:0; }
.mbar__tr { flex:1; min-width:0; height:4px; border-radius:2px; background:var(--stroke); overflow:hidden; }
.mbar__tr i { display:block; height:100%; border-radius:2px; background:var(--brand); }

/* 表格 */
.tb { width:100%; border-collapse:separate; border-spacing:0; margin-top:var(--space-card-gap); font-size:13px; }
.tb th, .tb td { padding:9px 11px; text-align:left; vertical-align:top; line-height:1.7; }
.tb th { background:var(--bg-page); color:var(--t-secondary); font-size:var(--fs-1); font-weight:500; }
.tb th:first-child { border-radius:var(--radius-default) 0 0 0; }
.tb th:last-child { border-radius:0 var(--radius-default) 0 0; }
.tb td { border-bottom:1px solid var(--divider); color:var(--t-primary); }
.tb tr:last-child td { border-bottom:none; }
.tb td:first-child { width:76px; color:var(--t-primary); }

.disc { margin-top:var(--space-card-gap); padding:0 2px 4px; font-size:var(--fs-1); color:var(--t-placeholder); line-height:18px; text-align:left; }

/* 吸底按钮 */
.paybar { flex-shrink:0; display:flex; align-items:center; gap:14px; background:#FFF; border-top:1px solid var(--divider); padding:12px 15px calc(12px + env(safe-area-inset-bottom,0px)); position:relative; z-index:6; }
.paybar .fixbar__btn { flex:1 1 auto; width:100%; }
.paybar .fixbar__sub { flex:0 0 auto; width:auto; padding:0 16px; }

/* 顶栏 ⋯ 切换菜单 */
.disp-sw { position:absolute; top:46px; right:8px; z-index:60; }
.disp-sw__menu { display:none; min-width:132px; padding:4px; background:#FFF; border-radius:var(--radius-card); box-shadow:0 4px 16px rgba(0,0,0,.12); }
.disp-sw.is-open .disp-sw__menu { display:block; animation:viewIn .18s var(--ease); }
.disp-sw__cap { display:block; padding:6px 12px 2px; font-size:10px; color:var(--t-placeholder); }
.disp-sw__menu button { display:block; width:100%; text-align:left; cursor:pointer; border:none; background:none; border-radius:var(--radius-large); font-family:var(--font); font-size:var(--fs-2); color:var(--t-primary); padding:8px 12px; }
.disp-sw__menu button:active { background:var(--brand-light); }
.disp-sw__menu button.is-cur { color:var(--brand); font-weight:600; }
.disp-sw__menu button[data-re] { margin-bottom:2px; border-bottom:1px solid var(--stroke); border-radius:var(--radius-large) var(--radius-large) 0 0; }

.toast { position:fixed; left:50%; bottom:92px; transform:translateX(-50%) translateY(8px); background:rgba(26,26,26,.88); color:#FFF; font-family:var(--font); font-size:var(--fs-2); padding:10px 16px; border-radius:var(--radius-panel); z-index:300; opacity:0; transition:opacity .22s var(--ease), transform .22s var(--ease); max-width:84vw; text-align:center; line-height:17px; }
.toast.is-show { opacity:1; transform:translateX(-50%) translateY(0); }

@media (max-width:360px) { .page { padding-left:var(--space-card-gap); padding-right:var(--space-card-gap); } .hero { padding:12px; } }
@media (prefers-reduced-motion:reduce) { * { animation-duration:.01ms !important; transition-duration:.01ms !important; } }
</style>
</head>
<body>
<div class="shell">
  <div class="phone">
    <header class="topbar">
      <button class="topbar__back" id="backBtn" aria-label="返回">
        <svg viewBox="0 0 24 24" fill="none"><path d="M15 6L9 12L15 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="topbar__title">减重评估报告</div>
      <button class="topbar__more" id="moreBtn" aria-label="更多"><span></span><span></span><span></span></button>
      <div class="disp-sw" id="dispSw">
        <div class="disp-sw__menu" id="dispMenu">
          <button data-re type="button">重新评估</button>
          <span class="disp-sw__cap">切换患者</span>
        </div>
      </div>
    </header>
    <main class="page" id="view"></main>
    <footer class="paybar" id="paybar" hidden></footer>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
'use strict';
/* ===== 工具 ===== */
var PROFILE_BASE = 'https://lipulin222.github.io/health-subscription-demo/patient-ai-summary/?from=assess#/';
var DISC = '本页内容基于你填写的问卷与已关联的健康数据生成，为初步评估建议，不构成诊断和处方。';
var ARW = '<svg viewBox="0 0 24 24" fill="none"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
var AXIS = ['无需减重','需要减重管理','需要减重与慢病结合管理'];

function ul(items){ return '<ul class="ul">' + items.map(function(it){ return '<li><b>'+it[0]+'</b>：'+it[1]+'</li>'; }).join('') + '</ul>'; }
function jin(w,pct){ return Math.round(w*pct/100*2); }
function drugTable(w){
  var TB = [['1 个月','3%–4%','−'+jin(w,3)+'~'+jin(w,4)+' 斤'],['3 个月','8%–10%','−'+jin(w,8)+'~'+jin(w,10)+' 斤'],['6 个月','12%–15%','−'+jin(w,12)+'~'+jin(w,15)+' 斤'],['12 个月','18%–21%','−'+jin(w,18)+'~'+jin(w,21)+' 斤']];
  return '<table class="tb"><thead><tr><th>周期</th><th>平均减重</th><th>你的参考值</th></tr></thead><tbody>' +
    TB.map(function(r){ return '<tr><td>'+r[0]+'</td><td>'+r[1]+'</td><td>'+r[2]+'</td></tr>'; }).join('') + '</tbody></table>';
}
function mbar(level,pct){
  return '<div class="mbar"><span class="mbar__lab">匹配度</span><span class="mbar__lv">'+level+'</span><span class="mbar__tr"><i style="width:'+pct+'%"></i></span></div>';
}
/* 用药模块：沿用现有定稿结构（匹配度条在前、分析在后） */
function drugNormal(p){
  return mbar('较高',78) +
    '<p>结合你的情况，我们建议在调整饮食和运动的同时，配合 GLP-1 类药物一起减：它通过延缓胃排空、降低食欲来减少摄入，让你在控制饮食的过程中少一些饥饿感，整体效果也比单靠生活方式更明确。</p>' +
    '<p>根据你当前的体重情况，参考按临床数据，用药后的体重预计变化情况如下：</p>' +
    drugTable(p.w) +
    '<p>用药前你可能想确认的：</p>' +
    ul([['是否会依赖','GLP-1 不是成瘾性药物，停药后由生活习惯接管维持'],['是否需要长期使用','达到目标后按复查结果逐步减量，多数人不需要一直使用'],['胃肠道反应','多在前 4 周逐渐适应，医生会从小剂量开始']]) +
    '<p class="note">上述区间来自临床研究，个体差异较大，以实际随访数据为准。</p>';
}
function drugMild(p, monitor){
  return drugNormal(p) +
    '<p>用药期间需留意'+monitor+'的变化，出现明显波动及时联系医生。</p>';
}
function drugOffline(p){
  return mbar('需医生面诊评估',65) +
    '<p>GLP-1 类药物与你正在使用的药物可能相互影响，需要医生统一评估后才能使用。</p>' +
    '<p class="note">匹配度基于初步信息估算，个体差异较大。</p>';
}

/* ===== 12 位样例患者（P1–P10 数据源：患者数据-提炼版字段维度.md；P11–P12 数据源：患者数据-转化结果-问卷序号1/2.md；文案按 v3 提示词重新生成） ===== */
var PATIENTS = [
{ id:'P1', name:'王雅静', profileId:'1004128765', gender:'女', age:32, h:162, w:83.5, bmi:31.8, tier:'normal',
  hint:'你的 BMI 已达 31.8，长期来看对血压、血脂和睡眠都是负担，减重的必要性明确。建议饮食、运动与药物治疗同步开展，三者结合能达到最好的效果。',
  mods:[
    { t:'整体建议', html:'<p>你的情况可以概括为：BMI 31.8，体检提示轻度脂肪肝，原因主要在饮食和久坐。这些信号指向同一个结论——需要把体脂降下来；而好消息是，脂肪肝尚未到用药程度，会随体脂下降改善，要解决的只是「怎么开始」。</p>' +
      ul([['当前的主要挑战是建立方法','你没有系统减重过，比下降速度更重要的，是形成能长期坚持的饮食和运动节奏'],['起步阶段注意保护关节','体重基数较大，运动从低冲击的方式开始，避免因受伤而中断']]) },
    { t:'饮食建议', html:'<p>饮食先调整结构，不需要刻意挨饿，一般坚持两三周就能感受到变化：</p>' +
      ul([['每餐七八分饱，三餐时间固定','规律的进餐节奏能避免饿过头后的过量进食'],['每餐先吃够蛋白质','鱼、禽、蛋、豆制品优先，抗饿的同时保住肌肉'],['主食换一半，含糖饮料换掉','一半精制主食换成杂粮杂豆，饮料改为白水或无糖茶']]) +
      '<p class="note">进入后续流程后，营养师会结合你的口味与作息给出个性化食谱。</p>' },
    { t:'运动建议', html:'<p>运动先把活动量建立起来，再逐步提升强度：</p>' +
      ul([['每天快走 20–30 分钟','通勤提前下车、饭后散步都可以计入'],['久坐时每小时起身活动','设提醒即可，避免连续久坐'],['两三周后加入力量训练','每周 2 次，保住肌肉量，减重后不易反弹']]) },
    { t:'用药建议', html:'@DRUG_NORMAL@' }
  ] },
{ id:'P2', name:'李婷', profileId:'1007331092', gender:'女', age:28, h:163, w:68.4, bmi:25.7, tier:'normal',
  hint:'你没有确诊慢病、未使用相关药物，BMI 25.7 刚过建议干预线，适合减重。建议生活方式与药物配合进行。',
  mods:[
    { t:'整体建议', html:'<p>你的基础条件不错，当前要做的是尽早开始，并在开始后保持节奏。</p>' +
      ul([['BMI 刚过干预线','25.7 离建议范围不远，现阶段干预的难度和成本都最低']]) },
    { t:'饮食建议', html:'<p>饮食先调整结构，不需要挨饿：</p>' +
      ul([['每餐七八分饱，三餐时间固定','避免饿过头后的过量进食'],['每餐先吃够蛋白质','鱼、禽、蛋、豆制品优先，抗饿且保住肌肉'],['主食换一半','白米白面换成一半杂粮杂豆，含糖饮料改为白水']]) +
      '<p class="note">进入后续流程后，营养师会结合你的口味与作息给出个性化食谱。</p>' },
    { t:'运动建议', html:'<p>运动从能长期坚持的量开始：</p>' +
      ul([['每天快走 30 分钟','可拆成 3 段完成，先固定频率，再逐渐加快'],['久坐时每小时起身活动','设提醒即可']]) },
    { t:'用药建议', html:'@DRUG_NORMAL@' }
  ] },
{ id:'P3', name:'许雯', profileId:'1003584417', gender:'女', age:35, h:160, w:68.2, bmi:26.6, tier:'mild', monitor:'血脂',
  hint:'你的血脂偏高，但尚未达到慢病程度，这个阶段减重本身就是改善血脂最有效的手段。建议饮食、运动与药物治疗同步开展，并按随访计划复查血脂。',

      ul([['血脂偏高但未确诊','仍在生活方式可以有效改善的阶段，宜早不宜迟'],['父亲有高血脂史','遗传背景意味着复查要更规律，建议按随访计划执行']]) },
    { t:'饮食建议', html:'<p>饮食优先控制对血脂影响最直接的部分：</p>' +
      ul([['油炸食品和肥肉先停','这两类对血脂的影响最直接'],['添加糖减半','含糖饮料、甜品先减一半'],['主食三分之一换粗粮','燕麦、豆类和足量蔬菜每天保证']]) +
      '<p>先按这个结构执行，3 个月后复查血脂，用数据判断是否需要进一步调整。</p>' +

var TIER = {
  normal:    { value:'需要减重管理', cur:2 },
  mild:      { value:'需要减重管理', cur:2 },
  offline:   { value:'需要减重与慢病结合管理', cur:3 },
  lifestyle: { value:'需要减重管理', cur:2 },
  exclude:   { value:'无需减重', cur:1 }
};

/* ===== 渲染 ===== */
var view = document.getElementById('view');
var toastEl = document.getElementById('toast');
var toastT;
function toast(msg){
  toastEl.hidden = false; toastEl.textContent = msg; toastEl.classList.add('is-show');
  clearTimeout(toastT); toastT = setTimeout(function(){ toastEl.classList.remove('is-show'); }, 1800);
}

function heroHtml(p){
  var t = TIER[p.tier], i, bars = '', axis = '';
  for (i = 0; i < AXIS.length; i++) {
    bars += '<i class="' + (i === t.cur - 1 ? 'is-on' : '') + '"></i>';
    axis += '<span class="' + (i === t.cur - 1 ? 'is-on' : '') + '">' + AXIS[i] + '</span>';
  }
  return '<section class="hero view-in">' +
    '<div class="hero__hd">' +
    '<span class="hero__name">' + p.name + '</span>' +
    '<span class="hero__meta">' + p.gender + ' · ' + p.age + ' 岁 · ' + p.h + 'cm / ' + p.w + 'kg · BMI ' + p.bmi + '</span>' +
    (p.profileId
      ? '<a class="hero__info" href="' + PROFILE_BASE + p.profileId + '" aria-label="查看用户资料详情">' +
        '<svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.6"/><path d="M12 11.2v4.8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="12" cy="8" r="1.1" fill="currentColor"/></svg>' +
        '</a>'
      : '') +
    '</div>' +
    '<div class="grade"><div class="grade__h"><span>减重建议</span><b>' + t.value + '</b></div>' +
    '<div class="grade__bar">' + bars + '</div><div class="grade__ax">' + axis + '</div></div>' +
    '<span class="hero__hint">' + p.hint + '</span>' +
    '</section>';
}

function render(id){
  var p = PATIENTS.filter(function(x){ return x.id === id; })[0];
  var html = heroHtml(p);
  html += p.mods.map(function(m, i){
    return '<section class="mod card">' +
      '<button class="mod__h" type="button" aria-expanded="true">' +
      '<span class="mod__no">' + ('0' + (i + 1)).slice(-2) + '</span>' +
      '<span class="mod__t">' + m.t + '</span>' +
      '<span class="mod__arw" aria-hidden="true">' + ARW + '</span></button>' +
      '<div class="mod__b"><div class="mod__b-in">' + m.html + '</div></div></section>';
  }).join('');
  html += '<div class="disc">' + DISC + '</div>';
  view.innerHTML = html;
  view.scrollTop = 0;

  /* 折叠交互 */
  view.querySelectorAll('.mod').forEach(function(mod){
    var h = mod.querySelector('.mod__h'), b = mod.querySelector('.mod__b');
    h.addEventListener('click', function(){
      var folded = mod.classList.toggle('is-fold');
      h.setAttribute('aria-expanded', folded ? 'false' : 'true');
      if (folded) { b.style.maxHeight = b.scrollHeight + 'px'; void b.offsetHeight; b.style.maxHeight = '0px'; }
      else { b.style.maxHeight = b.scrollHeight + 'px'; setTimeout(function(){ b.style.maxHeight = 'none'; }, 340); }
    });
  });
  /* 吸底按钮（按档位） */
  var bar = document.getElementById('paybar');
  bar.hidden = false; bar.innerHTML = '';
  function mkBtn(text, ghost, fn){
    var b = document.createElement('button');
    b.className = 'btn' + (ghost ? ' btn--ghost fixbar__sub' : ' fixbar__btn');
    b.type = 'button'; b.textContent = text;
    b.addEventListener('click', fn);
    return b;
  }
  if (p.tier === 'normal') {
    bar.appendChild(mkBtn('查看用药方案', false, function(){ toast('样例演示：未接用药方案页'); }));
  } else if (p.tier === 'offline' || p.tier === 'mild') {
    bar.appendChild(mkBtn('线上咨询', true, function(){ toast('样例演示：未接咨询二维码'); }));
    bar.appendChild(mkBtn('预约面诊', false, function(){ toast('样例演示：未接预约页'); }));
  } else {
    bar.appendChild(mkBtn(p.tier === 'lifestyle' ? '查看生活方式方案' : '返回', false, function(){ toast('样例演示：未接跳转'); }));
  }

  /* 菜单高亮 */
  document.querySelectorAll('#dispMenu button[data-p]').forEach(function(b){
    b.classList.toggle('is-cur', b.dataset.p === id);
  });
}

/* ===== 顶栏 ⋯ 菜单 ===== */
var menu = document.getElementById('dispMenu');
var sw = document.getElementById('dispSw');
PATIENTS.forEach(function(p){
  var b = document.createElement('button');
  b.type = 'button'; b.dataset.p = p.id; b.textContent = p.id + ' ' + p.name;
  b.addEventListener('click', function(){ sw.classList.remove('is-open'); render(p.id); });
  menu.appendChild(b);
});
document.getElementById('moreBtn').addEventListener('click', function(e){
  e.stopPropagation(); sw.classList.toggle('is-open');
});
document.addEventListener('click', function(e){
  if (!sw.contains(e.target)) sw.classList.remove('is-open');
});
menu.querySelector('button[data-re]').addEventListener('click', function(){
  sw.classList.remove('is-open'); toast('样例演示：未接评估问卷');
});
document.getElementById('backBtn').addEventListener('click', function(){ toast('样例演示：未接返回跳转'); });

render('P1');
</script>
</body>
</html>
