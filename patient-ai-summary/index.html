  let h = '<h1>患者AI总结 · 医生速览</h1><div class="sub">生成时间 2026-11-03 ｜ 基于结构化患者数据的自动总结，仅供医生快速了解概况，不构成诊断结论。点击姓名查看该患者的提炼字段与原始数据。</div>';
  DATA.forEach(p=>{
    const t = TIERS[p.tier];
    h += `<div class="card"><div class="p-head">
      <a class="p-name" href="#/${p.pid}">${esc(p.name)}</a>
      <span class="p-meta">${p.sex} · ${p.age}岁</span>
      <span class="p-id">${p.pid}</span>
      <span class="badge ${t.c}">${t.t}</span></div>
      <div class="profile">${esc(p.profile)}</div>
      ${p.quality?`<div class="tips">⚠ ${esc(p.quality)}</div>`:''}</div>`;
  });
  h += `<div class="sec-title">分流档位索引</div><div class="block" style="padding:0 18px 6px;">
    <table class="idx"><tr><th>档位</th><th>人设</th><th>医生动作</th></tr>
    <tr><td><span class="badge b-ok">无慢病·直达</span></td><td>王雅静、李婷（需先重填体重）</td><td>常规方案制定</td></tr>
    <tr><td><span class="badge b-warn">轻微异常</span></td><td>许雯（需先重填体重）</td><td>叮嘱复查血脂，设随访点</td></tr>
    <tr><td><span class="badge b-risk">线下优先</span></td><td>张建国、刘桂芳、赵德海、孙梦琪、周凯</td><td>P4/P5 核对降糖方案；P6 心功能评估；P7 核实药物性增重（不开放购买）；P8 加强随访</td></tr>
    <tr><td><span class="badge b-off">排除</span></td><td>沈佳怡、唐子睿</td><td>P9 营养科+备孕宣教；P10 转儿童内分泌科</td></tr></table></div>`;
  document.getElementById('app').innerHTML = h;
}

function renderDetail(p){
  const t = TIERS[p.tier];
  const fromAssess = new URLSearchParams(location.search).has('from');
  const backHref = fromAssess ? '../weight-management/Assessment-report-sample/index.html' : '#/list';
  const backLab = fromAssess ? '← 返回评估报告' : '← 返回列表';
  let h = `<a class="back" href="${backHref}">${backLab}</a>
  <div class="card"><div class="p-head">
    <span style="font-size:19px;font-weight:600;color:#006F8A;">${esc(p.name)}</span>
    <span class="p-meta">${p.sex} · ${p.age}岁 · ${p.birthday}</span>
    <span class="p-id">${p.pid}</span>
    <span class="badge ${t.c}">${t.t}</span></div>
    <div class="profile"><b>AI 画像：</b>${esc(p.profile)}</div>
    ${p.quality?`<div class="tips">⚠ ${esc(p.quality)}</div>`:''}</div>`;

  h += `<div class="sec-title">AI 总结要点</div><div class="block"><ul class="pts">${p.points.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`;

  h += `<div class="sec-title">提炼版字段（17 项）</div><div class="block">`;
  p.distilled.forEach(g=>{
    h += `<h3 style="margin-top:14px;">${esc(g[0])}</h3><table class="kv">`;
    g[1].forEach(r=>{h+=`<tr><th>${esc(r[0])}</th><td>${esc(r[1])}</td></tr>`;});
    h += `</table>`;
  });
  h += `<h3 style="margin-top:14px;">A 基础身份</h3><table class="kv"><tr><th>patient_id</th><td>${p.pid}</td></tr><tr><th>姓名</th><td>${esc(p.name)}</td></tr><tr><th>性别</th><td>${esc(p.sex)}</td></tr><tr><th>出生日期</th><td>${esc(p.birthday)}（${p.age}岁）</td></tr></table></div>`;

  h += `<div class="sec-title">原始信息</div>`;
  h += `<div class="block"><h3>订单（${p.orders.length} 笔）</h3>`;
  if(p.orders.length){
    h += `<table><tr><th>订单号</th><th>商品名</th><th>类别</th><th>规格</th><th>创建时间</th></tr>`;
    p.orders.forEach(o=>{h+=`<tr><td class="dim">${esc(o[0])}</td><td>${esc(o[1])}</td><td>${esc(o[2])}</td><td>${esc(o[3])}</td><td class="dim">${esc(o[4])}</td></tr>`;});
    h += `</table>`;
  } else h += `<p style="font-size:13px;color:#999;">无订单记录</p>`;
  h += `</div>`;

  h += `<div class="block"><h3>就诊记录（${p.visits.length} 次）</h3>`;
  if(p.visits.length){
    h += `<table><tr><th>到达时间</th><th>身高</th><th>体重(kg)</th><th>病历内容</th></tr>`;
    p.visits.forEach(v=>{h+=`<tr><td class="dim">${esc(v[0])}</td><td>${esc(v[1])}</td><td>${esc(v[2])}</td><td>${esc(v[3])}</td></tr>`;});
    h += `</table>`;
  } else h += `<p style="font-size:13px;color:#999;">无就诊记录</p>`;
  h += `</div>`;

  h += `<div class="block"><h3>体检报告（${p.reports.length} 份）</h3>`;
  p.reports.forEach(r=>{
    h += `<table class="kv">
      <tr><th>创建时间</th><td>${esc(r.created)}</td></tr>
      <tr><th>身高 / 体重 / BMI</th><td>${esc(r.h)} / ${esc(r.w)} / ${esc(r.bmi)}</td></tr>
      <tr><th>血压（收缩/舒张）</th><td>${esc(r.bp)} mmHg</td></tr>
      <tr><th>脉搏</th><td>${esc(r.pulse)} 次/分</td></tr>
      <tr><th>腰围</th><td>${esc(r.waist)}</td></tr>
      <tr><th>家族史</th><td>${esc(r.family)}</td></tr>
      <tr><th>既往病史</th><td>${esc(r.past)}</td></tr>
      <tr><th>主要发现</th><td>${esc(r.find)}</td></tr>
      <tr><th>体检建议</th><td class="dim">${esc(r.advice)}</td></tr></table><div style="height:10px"></div>`;
  });
  h += `</div>`;

  h += `<div class="block"><h3>问卷答案（10 题）</h3><table><tr><th style="width:40px;">题号</th><th style="width:150px;">题目</th><th>回答</th></tr>`;
  const QT = ['性别','年龄','身高体重','体重变化原因','已确诊的疾病','指标偏高','禁忌症','其他病史','备孕怀孕哺乳','非体重治疗目标'];
  p.answers.forEach((a,i)=>{h+=`<tr><td class="dim">${i+1}</td><td>${esc(QT[i])}</td><td>${esc(a[1])}</td></tr>`;});
  h += `</table></div>`;

  document.getElementById('app').innerHTML = h;
}

function route(){
  const hash = location.hash || '#/list';
  if(hash.startsWith('#/')){
    const id = hash.slice(2).split('?')[0];
    const p = DATA.find(x=>x.pid===id);
    if(p){ renderDetail(p); window.scrollTo(0,0); return; }
  }
  renderList();
}
window.addEventListener('hashchange', route);
route();
</script>
</body>
</html>
